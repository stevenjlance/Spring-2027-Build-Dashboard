name: Refresh dashboard

# Re-pulls the Asana board on a schedule by triggering a fresh Netlify build.
# The Netlify build hook URL is stored as the repo secret NETLIFY_BUILD_HOOK
# (Settings → Secrets and variables → Actions → New repository secret).

on:
  schedule:
    # Hourly during business hours (8am–6pm America/New_York) on weekdays.
    # Cron is UTC; ET is UTC-4 (summer) / UTC-5 (winter), so the window shifts ~1h in winter.
    - cron: "0 12-22 * * 1-5"
  workflow_dispatch: {}  # lets you trigger a refresh manually from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK secret is not set yet — nothing to trigger."
            echo "Add it under repo Settings → Secrets and variables → Actions, then re-run."
            exit 0   # skip cleanly during setup instead of failing
          fi
          curl -fsSL -X POST -d '{}' "$HOOK"
          echo "Triggered Netlify rebuild."
